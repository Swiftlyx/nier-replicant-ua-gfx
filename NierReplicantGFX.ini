; NierReplicantGFX settings. Restart the game after a change.
; Details: https://github.com/Swiftlyx/nier-replicant-ua-gfx/blob/main/README.en.md

[Supersampling]
; Renders the game larger than the screen and scales it down: smooth edges, no jaggies.
; 1.0 = off (default), 1.5 = good, 2.0 = best but heaviest (1920x1080 is rendered at 3840x2160).
RenderScale = 1.0

; Maximum render height, so that large screens do not overload the GPU. 0 = no limit. Default: 2160.
MaxRenderHeight = 2160

[AmbientOcclusion]
; Soft shadows in corners and under objects.
; 1 = improved shader (default), 0 = the game's own shader.
Shader = 1

; Shadow darkness (Shader = 1 only). 1.0 = as in the game (default), 0.5 = lighter, 2.0 = darker, 0 = off.
Strength = 1.0

; The two settings below apply only with Shader = 0.
; Remove the pattern that moves with the camera. 1 = remove (default), 0 = keep.
Pattern = 1
; Shadows near the screen edges. 0 = as in the game (default), 1 = up to the edge, 2 = up to the edge, fading.
ScreenEdges = 0

[PostProcess]
; Blurry trail behind moving objects. 0 = remove (default), 1 = keep.
FeedbackBlur = 0

; 16-bit colour buffers: smooth glows without rings. 1 = on (default), 0 = off.
HighPrecision = 1

; Dithering: hides the remaining colour bands. 1 = on (default), 0 = off.
Dither = 1

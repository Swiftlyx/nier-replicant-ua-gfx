; Налаштування NierReplicantGFX. Зміни діють після перезапуску гри.
; NierReplicantGFX settings. Restart the game to apply changes.

[AmbientOcclusion]
; Шейдер затінення (ambient occlusion):
;   1 - шейдер плагіна: без візерунка, тінь не зникає біля країв екрана;
;   0 - шейдер гри з виправленнями, які задають Pattern і ScreenEdges нижче.
; Ambient occlusion shader:
;   1 - the plugin's shader: no pattern, shadows do not fade near the screen edges;
;   0 - the game's shader with the fixes set by Pattern and ScreenEdges below.
Shader = 1

; Сила затінення (лише для Shader = 1): 1.0 - як у грі, менше - світліше, більше - темніше, 0 - вимкнено.
; Shading strength (Shader = 1 only): 1.0 - as in the game, lower - lighter, higher - darker, 0 - off.
Strength = 1.0

; Лише для Shader = 0. Прибрати візерунок, що рухається по поверхнях разом із камерою (1 - так, 0 - ні).
; Shader = 0 only. Remove the pattern that moves over surfaces with the camera (1 - yes, 0 - no).
Pattern = 1

; Лише для Shader = 0. Тінь біля країв екрана:
;   0 - як у грі: біля країв тінь блідне;
;   1 - тінь до самого краю, але зникає одразу, щойно предмет виходить за кадр;
;   2 - як 1, але зникає поступово.
; У режимах 1 і 2 на поверхнях під кутом до камери вздовж краю може з'являтися зайва тінь.
; Shader = 0 only. Shadows near the screen edges:
;   0 - as in the game: shadows fade near the edges;
;   1 - shadows reach the edge, but vanish as soon as the object leaves the screen;
;   2 - like 1, but they fade out gradually.
; Modes 1 and 2 can add false shading along the edge on surfaces seen at an angle.
ScreenEdges = 0

[PostProcess]
; Шлейф від попередніх кадрів (feedback blur), найпомітніший під час перекиду: 0 - прибрати, 1 - залишити.
; Trail of previous frames (feedback blur), most visible when rolling: 0 - remove, 1 - keep.
FeedbackBlur = 0

; 16-бітні буфери кадру замість 10-бітних: світіння й темні переходи без кілець, трохи більше відеопам'яті.
; 16-bit frame buffers instead of 10-bit: no rings in glows and dark gradients, a little more video memory.
HighPrecision = 1

; Дизеринг на виході: прибирає смуги, що лишаються після переведення в 8 біт (1 - так, 0 - ні).
; Output dithering: hides the bands left after the conversion to 8 bits (1 - on, 0 - off).
Dither = 1

[Supersampling]
; Суперсемплінг (SSAA): гра рендерить кадр у RenderScale разів більшим і зменшує його до розміру екрана,
; тож краї предметів рівні, без «сходинок». 1.0 - вимкнено, 2.0 - найкраща якість (1920x1080 рендериться
; як 3840x2160). Значення між ними легші для відеокарти, але згладжують гірше.
; Supersampling (SSAA): the game renders RenderScale times larger and scales the picture down to the
; screen, which smooths jagged edges. 1.0 - off, 2.0 - best quality (1920x1080 is rendered at 3840x2160).
RenderScale = 1.0

; Найбільша висота кадру при суперсемплінгу, щоб не перевантажувати відеокарту на великих екранах:
; з 2160 екран 2560x1440 отримає масштаб 1.5, а 3840x2160 - без суперсемплінгу. 0 - без обмеження.
; Largest render height with supersampling, to spare the graphics card on large screens: with 2160,
; 2560x1440 gets a scale of 1.5 and 3840x2160 none. 0 - no limit.
MaxRenderHeight = 2160
